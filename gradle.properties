# ==========================================================================================
#  MultiLoader-Template · Minecraft 26.1 · Kotlin DSL
#
#  这里的字段会被注入到资源模板中：
#      fabric.mod.json / META-INF/neoforge.mods.toml / *.mixins.json / pack.mcmeta
#  新增字段时，请同步登记到 BuildManager/src/main/kotlin/multiloader/ModTemplate.kt
#  （构建插件的版本不在这里，见 BuildManager/gradle.properties）
# ==========================================================================================

# ---- Gradle ----
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
# 模板里的注释/描述含中文，统一按 UTF-8 处理
systemProp.file.encoding=UTF-8
# Loom 在 IntelliJ IDEA 下与 configuration cache 仍有兼容问题：
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# ---- 模组元信息 ----
mod_name=ExampleMod
mod_id=examplemod
mod_author=YourName
group=com.example.examplemod
version=26.1.0.0
license=CC0-1.0
credits=Built on MultiLoader-Template (Minecraft 26.1)
description=The description of your mod. \nAccepts multilines.
# Minecraft 26.1 需要 Java 25
java_version=25

# ---- Minecraft ----
minecraft_version=26.1
# NeoForge（Maven 版本区间语法）
minecraft_version_range=[26.1,26.2)
# Fabric（semver 语法）
fabric_minecraft_dependency=~26.1
# common 模块使用 ModDevGradle 的 vanilla(NeoForm) 模式，需要指定 NeoForm 版本
# https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1-1

# ---- Fabric ----
# https://fabricmc.net/develop/
# Minecraft 26.x 起 Fabric 移除了 intermediary，直接使用 Mojang 官方映射，
# 因此 fabric/build.gradle.kts 中不再需要 mappings { } 配置
fabric_loader_version=0.19.5
fabric_api_version=0.145.1+26.1

# ---- NeoForge ----
# https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.1.0.1-beta
neoforge_version_range=[26.1.0.1-beta,)
# NeoForge 的 FML 加载器版本区间
neoforge_loader_version_range=[4,)

# ---- Mixin ----
# common 编译期使用的 Mixin / MixinExtras 版本。
# mixinextras_version 必须 <= 两个加载器运行时实际内置的最低版本：
#   NeoForge 26.1.0.1-beta -> mixinextras-neoforge 0.5.3 / sponge-mixin 0.16.5+mixin.0.8.7
#   Fabric Loader 0.19.5   -> mixinextras-fabric   0.5.5 / sponge-mixin 0.17.4+mixin.0.8.7
mixin_version=0.8.5
mixinextras_version=0.5.3
