# ==========================================================================================
#  BuildManager 是一个独立的 Gradle 构建（included build），
#  它读不到主构建根目录的 gradle.properties，因此构建插件的版本在这里单独维护。
#
#  升级顺序建议：先 Gradle wrapper -> 再 Loom / ModDevGradle -> 最后游戏与加载器版本
# ==========================================================================================

# Fabric Loom：https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml
# 1.17 起使用基于 Property 的 RunConfiguration API（displayName / generateRunConfig / runDirectory），
# 并且要求 Gradle >= 9.4；本模板使用 Gradle 9.7.1。
loom_version=1.17.20

# ModDevGradle：https://projects.neoforged.net/neoforged/moddevgradle
moddev_version=2.0.147
